name: DaNikeAI Release
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/release.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.DANIKEAI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DANIKEAI_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DANIKEAI_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DANIKEAI_KEY_ALIAS }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/danikeai-release.keystore" && mkdir -p "$HOME/.config" && printf "storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$RUNNER_TEMP/danikeai-release.keystore" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$HOME/.config/danikeai-signing.properties"
      - name: Identificar versão Android
        id: app_version
        shell: bash
        run: |
          VERSAO=$(grep -m1 'versionName' app/build.gradle | cut -d '"' -f2)
          CODIGO=$(grep -m1 'versionCode' app/build.gradle | awk '{print $2}')
          [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CODIGO" =~ ^[0-9]+$ ]]
          echo "tag=v${VERSAO}" >> "$GITHUB_OUTPUT"
          echo "label=NEXO v${VERSAO} Code ${CODIGO}" >> "$GITHUB_OUTPUT"
      - name: Gerar APK Release
        run: export GRADLE_OPTS="-Xmx6g -Dfile.encoding=UTF-8" && ./gradlew assembleRelease --stacktrace
      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk NEXO.apk
      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: ${{ steps.app_version.outputs.label }}
          generate_release_notes: true
          files: NEXO.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
